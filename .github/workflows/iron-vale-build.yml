name: iron-vale-build

# Separate from upstream's dev.yml/release.yml/docker-bake.hcl on purpose --
# those build the unrelated sdxl/sd3/flux*/z-image-turbo matrix and are tied
# to this repo's changesets-based release automation. This workflow only
# builds Dockerfile.iron-vale and is otherwise independent, so it won't
# fight with upstream's own CI if this fork ever syncs from it.

on:
  push:
    branches: [main]
    paths:
      - "Dockerfile.iron-vale"
      - "input/**"
      - "workflows/**"
      - ".github/workflows/iron-vale-build.yml"
  workflow_dispatch: {}

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free up runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc "/usr/local/share/boost" "$AGENT_TOOLSDIRECTORY"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.iron-vale
          platforms: linux/amd64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/iron-vale-comfyui-worker:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/iron-vale-comfyui-worker:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
